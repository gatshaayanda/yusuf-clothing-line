name: Deploy Yusuf Firebase rules (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yusuf-firebase-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate explicit Yusuf project target
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "yusuf-clothing-line"

      - name: Write and validate Yusuf service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e 'const a=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(a.project_id!=="yusuf-clothing-line") process.exit(1)' "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Yusuf Firestore and Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Remove Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
